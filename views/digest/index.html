<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>多群每日简报</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header><div><p class="eyebrow">ASTRBOT · DAILY DIGEST</p><h1>多群每日简报</h1></div><button id="refresh">刷新</button></header>
  <p class="notice">开发预览版 · 可配置任务并生成预览。定时投递、补发和提醒尚未开放，不会向 QQ 发送消息。</p>
  <div id="message" role="status" aria-live="polite"></div>
  <div class="layout">
    <aside>
      <div class="section-title"><h2>任务</h2><button id="new">＋ 新建</button></div>
      <div id="tasks"></div>
      <details><summary>全局设置</summary>
        <label>同时生成上限<input id="concurrency" type="number" min="1" value="1"></label>
        <label>执行详情保留天数<input id="retention" type="number" min="1" value="30"></label>
        <button id="settings-save">保存全局设置</button>
      </details>
    </aside>
    <main>
      <div class="section-title"><h2 id="task-title">新建任务</h2><span class="badge">默认停用</span></div>
      <nav aria-label="任务详情"><button data-tab="config" aria-current="page">配置</button><button data-tab="preview">预览</button><button data-tab="records">执行记录</button><button data-tab="reminders">关联提醒</button></nav>
      <section id="config" class="tab">
        <form id="form">
          <label>任务名称<input name="name" placeholder="例如：课程通知" maxlength="200"></label>
          <div class="grid"><label>主模型<select name="provider_id"></select></label><label>人格（可选）<select name="persona_id"></select></label></div>
          <label>选择源群<select id="group-picker"><option value="">选择群后添加</option></select></label>
          <label>源群 UMO（每行一个）<textarea name="groups" rows="3" placeholder="平台实例:GroupMessage:群号"></textarea></label>
          <label>私聊收件人 UMO<input name="recipient" placeholder="私聊机器人发送 /sid 获取"></label>
          <div class="grid"><label>频率<select name="frequency"><option value="daily">每日</option><option value="weekly">每周</option></select></label><label>执行时间<input name="time" type="time" value="08:00"></label></div>
          <div id="weekdays"><span>每周执行日</span><div class="day-options"></div></div>
          <div class="grid"><label>时区<input name="timezone" value="Asia/Shanghai"></label><label>回看时长（小时）<input name="lookback_hours" type="number" min="1" value="24"></label></div>
          <label>总结提示词<textarea name="prompt" rows="6"></textarea></label>
          <div class="grid triple"><label>默认提前（分钟）<input name="lead_minutes" type="number" min="0" value="30"></label><label>候选日期天数<input name="candidate_days" type="number" min="1" value="7"></label><label>清单有效（小时）<input name="selection_hours" type="number" min="1" value="24"></label></div>
          <div class="actions"><button type="submit" class="primary">保存配置</button><button type="button" id="archive">归档任务</button></div>
        </form>
      </section>
      <section id="preview" class="tab" hidden>
        <p class="muted">预览会调用模型并可能产生费用；使用本页配置，先保存再生成，不发送 QQ 消息。</p>
        <button id="generate" class="primary">保存并生成预览</button>
        <p id="preview-state"></p><pre id="preview-text" class="result">尚无预览。</pre>
        <details><summary>消息覆盖与生成信息</summary><pre id="preview-meta"></pre></details>
      </section>
      <section id="records" class="tab" hidden><div id="run-list">选择任务后查看记录。</div><button id="more">下一页</button></section>
      <section id="reminders" class="tab" hidden><p class="muted">提醒功能尚未开放。后续会在这里展示候选清单、已创建提醒与待确认变更。</p></section>
    </main>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
