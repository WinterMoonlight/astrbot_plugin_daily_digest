<aside class="character-layer" aria-label="收尾寄语">
  <div class="character-portrait" aria-hidden="true"><img class="main-character" src="{{CHARACTER}}" alt="" draggable="false"></div>
  <div class="character-caption">
    <p class="closing-title" data-field="closing-title"></p>
    <p class="closing-note" data-field="closing-note"></p>
    <span class="closing-signature">— 守岸人</span>
  </div>
  <span class="closing-spark" aria-hidden="true">✧</span>
</aside>
