<article class="digest-card">
  <div class="card-heading">
    <div class="card-heading-copy">
      <div class="card-topline"><span class="card-number" data-field="number"></span><span class="category" data-field="category"></span></div>
      <div class="card-title-row"><h2 data-field="title"></h2></div>
    </div>
    <div class="card-sticker-slot" data-slot="sticker"></div>
  </div>
  <div class="body-panel"><div class="card-body" data-field="body"></div></div>
</article>
